<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7つの習慣 - ドットRPG</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #050508;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #game-container {
            width: 480px;
            height: 720px;
            background-color: #000;
            border: 4px solid #fff;
            position: relative;
            overflow: hidden;
        }

        .screen {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
            flex-direction: column;
            padding: 16px;
            background-color: #000;
        }

        .active {
            display: flex;
        }

        .pixel-box {
            background-color: #000;
            border: 4px solid #fff;
            padding: 12px;
            color: #fff;
        }

        .pixel-btn {
            background: #111;
            border: 2px solid #fff;
            color: #fff;
            padding: 10px;
            cursor: pointer;
            font-size: 14px;
            margin: 6px 0;
            text-align: center;
            width: 100%;
        }
        .pixel-btn:hover {
            background: #ffcc00;
            color: #000;
            font-weight: bold;
        }

        /* スキン視覚選択カード */
        .skin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }
        .skin-card {
            border: 2px solid #555;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .skin-card.selected {
            border-color: #ffcc00;
            background: #222;
        }
        .skin-preview {
            width: 32px;
            height: 48px;
            margin-bottom: 6px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* ドット会話ウィンドウ（黒背景・白太枠） */
        #dialogue-overlay {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            background-color: #000000;
            border: 4px solid #ffffff;
            padding: 12px;
            display: none;
            z-index: 100;
            box-shadow: 0 0 10px #000;
        }

        .choice-btn {
            display: block;
            width: 100%;
            text-align: left;
            margin-top: 6px;
            background: #000;
            border: 1px solid #fff;
            color: #fff;
            padding: 8px;
            cursor: pointer;
            font-size: 12px;
        }
        .choice-btn:hover {
            background: #ffcc00;
            color: #000;
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 1. タイトル画面 -->
    <div id="title-screen" class="screen active" style="justify-content:center; align-items:center; text-align:center;">
        <h1 style="color:#ffcc00; font-size:24px; margin-bottom:30px; line-height:1.4;">7つの習慣<br>ドットRPG</h1>
        <button class="pixel-btn" onclick="goToSetup()">はじめから</button>
        <button class="pixel-btn" onclick="openMenu()">設定・メニュー</button>
    </div>

    <!-- 2. 名前・スキン選択画面 -->
    <div id="setup-screen" class="screen pixel-box">
        <h3 style="color:#ffcc00; margin-top:0;">キャラクター作成</h3>
        <label style="font-size:12px;">名前を入力してください:</label>
        <input type="text" id="player-name-input" value="" placeholder="（名前を入力）" style="width:100%; padding:8px; margin:10px 0; background:#111; border:1px solid #fff; color:#fff;">

        <label style="font-size:12px;">スキンを選択:</label>
        <div class="skin-grid">
            <div class="skin-card selected" onclick="selectSkin('学ラン', '#223355', this)">
                <canvas class="skin-canvas" width="32" height="48" data-color="#223355"></canvas>
                <span style="font-size:11px; margin-top:4px;">学ラン</span>
            </div>
            <div class="skin-card" onclick="selectSkin('ブレザー(パンツ)', '#334433', this)">
                <canvas class="skin-canvas" width="32" height="48" data-color="#334433"></canvas>
                <span style="font-size:11px; margin-top:4px;">ブレザー(パンツ)</span>
            </div>
            <div class="skin-card" onclick="selectSkin('ブレザー(スカート)', '#552233', this)">
                <canvas class="skin-canvas" width="32" height="48" data-color="#552233"></canvas>
                <span style="font-size:11px; margin-top:4px;">ブレザー(スカート)</span>
            </div>
            <div class="skin-card" onclick="selectSkin('セーラー', '#112244', this)">
                <canvas class="skin-canvas" width="32" height="48" data-color="#112244"></canvas>
                <span style="font-size:11px; margin-top:4px;">セーラー</span>
            </div>
        </div>

        <button class="pixel-btn" onclick="startGame()">決定してマップへ</button>
    </div>

    <!-- 3. ステージ選択マップ -->
    <div id="map-screen" class="screen pixel-box" style="overflow-y:auto;">
        <h3 style="color:#ffcc00; margin-top:0;">ステージ選択</h3>
        <p style="font-size:13px;">所持ポイント: <span id="user-points" style="color:#ffcc00;">0</span> PT</p>
        <div id="stage-buttons"></div>
    </div>

    <!-- 4. メインゲーム画面 -->
    <div id="game-screen" class="screen" style="padding:0;">
        <div style="position:absolute; top:8px; left:8px; right:8px; display:flex; justify-content:space-between; z-index:10;">
            <div class="pixel-box" id="mission-tracker" style="font-size:11px; padding:6px; background:rgba(0,0,0,0.85);">Mission: ---</div>
            <button class="pixel-btn" style="width:auto; padding:4px 8px; font-size:10px; margin:0;" onclick="openMenu()">MENU</button>
        </div>
        
        <canvas id="game-canvas" width="480" height="720"></canvas>

        <!-- 会話ウィンドウ（黒背景・白太枠） -->
        <div id="dialogue-overlay">
            <div id="speaker-name" style="color:#ffcc00; font-weight:bold; font-size:13px; margin-bottom:4px;"></div>
            <div id="dialogue-text" style="font-size:12px; line-height:1.5;"></div>
            <div id="choices-container" style="margin-top:8px;"></div>
        </div>
    </div>

    <!-- 5. ステージ評価画面 -->
    <div id="eval-screen" class="screen pixel-box" style="overflow-y:auto;">
        <h3 style="color:#ffcc00; margin-top:0;">STAGE CLEAR!</h3>
        <canvas id="radarChart" width="300" height="200"></canvas>
        <p style="margin-top:10px; font-size:13px;"><b>診断タイプ:</b> <span id="eval-type" style="color:#ffcc00;">--</span></p>
        <p style="font-size:13px;"><b>アドバイス:</b></p>
        <p id="eval-advice" style="font-size:12px; color:#ccc; line-height:1.5;"></p>
        <button class="pixel-btn" onclick="goToMap()">マップに戻る</button>
    </div>

    <!-- 6. 設定・セーブ消去メニュー -->
    <div id="menu-screen" class="screen pixel-box">
        <h3 style="color:#ffcc00; margin-top:0;">メニュー / 設定</h3>
        <label style="font-size:12px;">BGM 音量調整:</label><br>
        <input type="range" id="bgm-volume" min="0" max="100" value="50" style="width:100%; margin:10px 0;"><br><br>
        <button class="pixel-btn" style="background:#500; border-color:#f55;" onclick="resetData()">セーブデータを削除して最初から</button><br><br>
        <button class="pixel-btn" onclick="closeMenu()">閉じる</button>
    </div>
</div>

<script>
    let gameState = {
        name: "",
        skin: "学ラン",
        skinColor: "#223355",
        points: 0,
        unlockedStages: 1,
        currentStage: 1,
        talkedNpcList: []
    };

    let selectedSkinTemp = "学ラン";
    let selectedSkinColorTemp = "#223355";

    // 全7ステージの定義
    const stages = [
        { 
            id: 1, 
            name: "STAGE 1: 家 - 朝", 
            mission: "朝の準備をして出発しよう",
            bgType: "home",
            interactions: [
                { id: "clock", x: 120, y: 320, name: "目覚まし時計", text: "アラームが鳴っている。どうする？", options: [{ text: "すぐに起きて布団をたたむ", pts: 20 }, { text: "あと5分だけ寝る", pts: 0 }] },
                { id: "desk", x: 320, y: 320, name: "学習デスク", text: "今日持って行く教科書が散らばっている。", options: [{ text: "時間割通りにカバンに入れる", pts: 20 }, { text: "全部まとめて適当に詰め込む", pts: 5 }] }
            ]
        },
        { 
            id: 2, 
            name: "STAGE 2: 校門 - 登校", 
            mission: "挨拶をして校内に入ろう",
            bgType: "gate",
            interactions: [
                { id: "guard", x: 160, y: 400, name: "挨拶運動の生徒", text: "「おはようございます！」と元気に声をかけられた。", options: [{ text: "相手の目を見て元気に挨拶を返す", pts: 20 }, { text: "会釈だけして通り過ぎる", pts: 10 }] },
                { id: "trash", x: 300, y: 480, name: "校門前のゴミ", text: "足元に空き缶が落ちている。", options: [{ text: "拾ってゴミ箱に捨てる", pts: 20 }, { text: "見なかったことにして進む", pts: 0 }] }
            ]
        },
        { 
            id: 3, 
            name: "STAGE 3: 教室 - 第1日目", 
            mission: "散らかった環境を整頓しよう",
            bgType: "classroom",
            interactions: [
                { id: "desk_messy", x: 140, y: 380, name: "散らかった机", text: "教科書やプリントが山積みになっている。", options: [{ text: "カテゴリごとに整頓する", pts: 20 }, { text: "一旦足元に押し込む", pts: 0 }] },
                { id: "npc_mirai", x: 260, y: 460, name: "未来（クラスメイト）", text: "「おはよう！今日の準備、手伝ってくれないかな？」", options: [{ text: "喜んで！一緒に片付けよう", pts: 20 }, { text: "自分のことで手一杯だから無理", pts: 0 }] }
            ]
        },
        { 
            id: 4, 
            name: "STAGE 4: 廊下 - 昼休み", 
            mission: "落とし物の持ち主を探そう",
            bgType: "corridor",
            interactions: [
                { id: "item_lost", x: 180, y: 420, name: "落とし物の生徒手帳", text: "廊下に生徒手帳が落ちている。", options: [{ text: "職員室に届ける", pts: 20 }, { text: "そのまま放置する", pts: 0 }] }
            ]
        },
        { 
            id: 5, 
            name: "STAGE 5: 体育館 - 練習日", 
            mission: "みんなと協力して準備を終えよう",
            bgType: "gym",
            interactions: [
                { id: "balls", x: 200, y: 400, name: "用具箱", text: "ボールが散乱している。", options: [{ text: "声を出して全員で一気に片付ける", pts: 20 }, { text: "１人で黙々と片付ける", pts: 10 }] }
            ]
        },
        { 
            id: 6, 
            name: "STAGE 6: 運動場 - 昼", 
            mission: "チームの分け方を話し合おう",
            bgType: "field",
            interactions: [
                { id: "captain", x: 240, y: 450, name: "キャプテン", text: "「チーム分けで意見が割れているんだ…」", options: [{ text: "全員の希望を聞いてWin-Winな提案をする", pts: 20 }, { text: "ジャンケンで強引に決める", pts: 5 }] }
            ]
        },
        { 
            id: 7, 
            name: "STAGE 7: お店 - 放課後", 
            mission: "買い物を済ませて振り返ろう",
            bgType: "shop",
            interactions: [
                { id: "clerk", x: 220, y: 400, name: "店員さん", text: "「今日もお疲れ様！振り返りはできた？」", options: [{ text: "今日の行動をメモして改善点を探す", pts: 20 }, { text: "何も考えずに買い物を終える", pts: 5 }] }
            ]
        }
    ];

    function init() {
        let saved = localStorage.getItem('7habits_save');
        if(saved) {
            gameState = JSON.parse(saved);
        }
        renderSkinPreviews();
    }

    function renderSkinPreviews() {
        document.querySelectorAll('.skin-canvas').forEach(canvas => {
            let ctx = canvas.getContext('2d');
            let color = canvas.getAttribute('data-color');
            ctx.clearRect(0, 0, 32, 48);
            drawPixelSprite(ctx, 6, 4, color);
        });
    }

    function saveGame() {
        localStorage.setItem('7habits_save', JSON.stringify(gameState));
    }

    function goToSetup() {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('setup-screen').classList.add('active');
        renderSkinPreviews();
    }

    function selectSkin(skinName, color, el) {
        selectedSkinTemp = skinName;
        selectedSkinColorTemp = color;
        document.querySelectorAll('.skin-card').forEach(c => c.classList.remove('selected'));
        el.classList.add('selected');
    }

    function startGame() {
        let inputName = document.getElementById('player-name-input').value.trim();
        gameState.name = inputName;
        gameState.skin = selectedSkinTemp;
        gameState.skinColor = selectedSkinColorTemp;
        saveGame();
        goToMap();
    }

    function goToMap() {
        saveGame();
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('map-screen').classList.add('active');
        document.getElementById('user-points').innerText = gameState.points;

        let container = document.getElementById('stage-buttons');
        container.innerHTML = "";
        stages.forEach(st => {
            let btn = document.createElement('button');
            btn.className = "pixel-btn";
            if(st.id <= gameState.unlockedStages) {
                btn.innerText = st.name;
                btn.onclick = () => launchStage(st.id);
            } else {
                btn.innerText = st.name + " 🔒";
                btn.disabled = true;
                btn.style.opacity = "0.4";
            }
            container.appendChild(btn);
        });
    }

    function launchStage(stageId) {
        gameState.currentStage = stageId;
        gameState.talkedNpcList = [];
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('game-screen').classList.add('active');
        
        let st = stages.find(s => s.id === stageId);
        document.getElementById('mission-tracker').innerText = "Mission: " + st.mission;

        drawStageCanvas(st);
    }

    function drawStageCanvas(st) {
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        // 背景クォータービュー描画
        drawIsometricBackground(ctx, st.bgType);

        // インタラクション対象描画
        st.interactions.forEach(item => {
            drawObjectOrNpc(ctx, item.x, item.y, item.name);
        });

        // プレイヤー描画（選択したスキン色適用）
        drawPixelSprite(ctx, 220, 560, gameState.skinColor);

        // タップ判定
        canvas.onclick = (e) => {
            let rect = canvas.getBoundingClientRect();
            let clickX = e.clientX - rect.left;
            let clickY = e.clientY - rect.top;

            st.interactions.forEach(item => {
                if (Math.abs(clickX - item.x) < 40 && Math.abs(clickY - item.y) < 40) {
                    triggerInteraction(item, st);
                }
            });
        };
    }

    function drawIsometricBackground(ctx, bgType) {
        // 壁
        ctx.fillStyle = bgType === 'home' ? '#4a3b32' : bgType === 'gym' ? '#2b3a4a' : '#3a3845';
        ctx.fillRect(0, 0, 480, 240);

        // 黒板・窓枠など
        ctx.fillStyle = "#1e4d3b";
        ctx.fillRect(80, 40, 320, 120);
        ctx.strokeStyle = "#8d5b4c";
        ctx.lineWidth = 6;
        ctx.strokeRect(80, 40, 320, 120);

        // 床
        for (let y = 240; y < 720; y += 32) {
            for (let x = 0; x < 480; x += 32) {
                ctx.fillStyle = ((x / 32 + y / 32) % 2 === 0) ? "#c29b62" : "#b08850";
                ctx.fillRect(x, y, 32, 32);
                ctx.strokeStyle = "#96703b";
                ctx.lineWidth = 1;
                ctx.strokeRect(x, y, 32, 32);
            }
        }
    }

    function drawObjectOrNpc(ctx, x, y, name) {
        // オブジェクト/NPCマーカー
        ctx.fillStyle = "#e76f51";
        ctx.fillRect(x - 12, y - 20, 24, 24);
        ctx.fillStyle = "#fff";
        ctx.font = "10px Courier New";
        ctx.fillText(name, x - 20, y - 26);
    }

    function drawPixelSprite(ctx, x, y, color) {
        // ドット絵頭・服
        ctx.fillStyle = "#ffdbac";
        ctx.fillRect(x + 4, y, 12, 12);
        ctx.fillStyle = "#4a3728";
        ctx.fillRect(x + 2, y - 4, 16, 6);
        ctx.fillStyle = color;
        ctx.fillRect(x + 2, y + 12, 16, 16);
        ctx.fillStyle = "#111";
        ctx.fillRect(x + 4, y + 28, 4, 8);
        ctx.fillRect(x + 12, y + 28, 4, 8);
    }

    function triggerInteraction(item, st) {
        let dialogue = document.getElementById('dialogue-overlay');
        let choices = document.getElementById('choices-container');
        choices.innerHTML = "";

        if (gameState.talkedNpcList.includes(item.id)) {
            document.getElementById('speaker-name').innerText = "【確認】";
            document.getElementById('dialogue-text').innerText = "（もう用はないようだ。）";
            dialogue.style.display = "block";

            let closeBtn = document.createElement('button');
            closeBtn.className = "choice-btn";
            closeBtn.innerText = "閉じる";
            closeBtn.onclick = () => { dialogue.style.display = "none"; };
            choices.appendChild(closeBtn);
            return;
        }

        dialogue.style.display = "block";
        document.getElementById('speaker-name').innerText = item.name;
        document.getElementById('dialogue-text').innerText = item.text;

        item.options.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = "choice-btn";
            btn.innerText = opt.text;
            btn.onclick = () => {
                gameState.points += opt.pts;
                gameState.talkedNpcList.push(item.id);
                dialogue.style.display = "none";

                // 全タスク完了判定
                if (gameState.talkedNpcList.length >= st.interactions.length) {
                    finishStage();
                }
            };
            choices.appendChild(btn);
        });
    }

    function finishStage() {
        if(gameState.currentStage === gameState.unlockedStages) {
            gameState.unlockedStages++;
        }
        saveGame();
        
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('eval-screen').classList.add('active');

        renderChart();
    }

    function renderChart() {
        let ctx = document.getElementById('radarChart').getContext('2d');
        if(window.myChart) window.myChart.destroy();

        window.myChart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['主体性', '目的設定', '優先順位', 'Win-Win', '理解と尊重', 'シナジー'],
                datasets: [{
                    label: '能力値',
                    data: [85, 70, 75, 90, 65, 80],
                    backgroundColor: 'rgba(255, 204, 0, 0.2)',
                    borderColor: '#ffcc00',
                    pointBackgroundColor: '#fff'
                }]
            },
            options: {
                scales: {
                    r: {
                        angleLines: { color: '#555' },
                        grid: { color: '#444' },
                        pointLabels: { color: '#fff', font: { size: 10 } },
                        ticks: { display: false, backdropColor: 'transparent' }
                    }
                },
                plugins: { legend: { display: false } }
            }
        });

        document.getElementById('eval-type').innerText = "主体的な解決者タイプ";
        document.getElementById('eval-advice').innerText = "周りを巻き込みながら素早く行動できました！次は優先順位をさらに意識してみましょう。";
    }

    function openMenu() {
        document.getElementById('menu-screen').classList.add('active');
    }

    function closeMenu() {
        document.getElementById('menu-screen').classList.remove('active');
    }

    function resetData() {
        if(confirm("本当にセーブデータを全削除して最初からにしますか？")) {
            localStorage.removeItem('7habits_save');
            location.reload();
        }
    }

    init();
</script>
</body>
</html>
