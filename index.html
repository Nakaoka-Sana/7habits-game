<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7つの習慣 - レトロRPG</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --pixel-bg: #000000;
            --pixel-border: #ffffff;
            --pixel-accent: #ffcc00;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #game-container {
            width: 480px;
            height: 720px;
            background-color: var(--pixel-bg);
            border: 4px solid var(--pixel-border);
            position: relative;
            overflow: hidden;
        }

        .screen {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
            flex-direction: column;
            padding: 16px;
        }

        .active {
            display: flex;
        }

        /* レトロドットUI */
        .pixel-box {
            background-color: #000;
            border: 4px solid #fff;
            padding: 12px;
            color: #fff;
        }

        .pixel-btn {
            background: #222;
            border: 2px solid #fff;
            color: #fff;
            padding: 10px;
            cursor: pointer;
            font-size: 14px;
            margin: 4px 0;
            text-align: center;
            width: 100%;
        }
        .pixel-btn:hover {
            background: #ffcc00;
            color: #000;
        }

        /* スキン選択 */
        .skin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }
        .skin-card {
            border: 2px solid #777;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            background: #111;
        }
        .skin-card.selected {
            border-color: #ffcc00;
            background: #333;
        }

        /* 下部ドットテキストメッセージ（黒背景・白太枠） */
        #dialogue-overlay {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background-color: #000000;
            border: 4px solid #ffffff;
            padding: 12px;
            display: none;
            z-index: 100;
        }

        .choice-btn {
            display: block;
            width: 100%;
            text-align: left;
            margin-top: 6px;
            background: #111;
            border: 1px solid #fff;
            color: #fff;
            padding: 8px;
            cursor: pointer;
            font-size: 12px;
        }
        .choice-btn:hover {
            background: #ffcc00;
            color: #000;
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 1. タイトル画面 -->
    <div id="title-screen" class="screen active" style="justify-content:center; align-items:center; text-align:center;">
        <h1 style="color:#ffcc00; font-size:24px; margin-bottom:30px;">7つの習慣<br>ドットRPG</h1>
        <button class="pixel-btn" onclick="goToSetup()">はじめから（スタート）</button>
        <button class="pixel-btn" onclick="openMenu()">設定・メニュー</button>
    </div>

    <!-- 2. 名前・初期スキン選択画面（初期状態は空欄） -->
    <div id="setup-screen" class="screen pixel-box">
        <h3>キャラクター作成</h3>
        <label>名前を入力してください（空欄可）:</label>
        <input type="text" id="player-name-input" value="" placeholder="（名前を入力）" style="width:100%; padding:8px; margin:10px 0; background:#111; border:1px solid #fff; color:#fff;">

        <label>初期スキンを選択:</label>
        <div class="skin-grid">
            <div class="skin-card selected" onclick="selectSkin('学ラン', this)">学ラン</div>
            <div class="skin-card" onclick="selectSkin('ブレザー(パンツ)', this)">ブレザー(パンツ)</div>
            <div class="skin-card" onclick="selectSkin('ブレザー(スカート)', this)">ブレザー(スカート)</div>
            <div class="skin-card" onclick="selectSkin('セーラー', this)">セーラー</div>
        </div>

        <button class="pixel-btn" onclick="startGame()">決定してステージマップへ</button>
    </div>

    <!-- 3. ステージ選択マップ -->
    <div id="map-screen" class="screen pixel-box" style="overflow-y:auto;">
        <h3>ステージ選択</h3>
        <p>所持ポイント: <span id="user-points" style="color:#ffcc00;">0</span> PT</p>
        <div id="stage-buttons"></div>
    </div>

    <!-- 4. メインゲーム画面 -->
    <div id="game-screen" class="screen" style="padding:0;">
        <div style="position:absolute; top:8px; left:8px; right:8px; display:flex; justify-content:space-between; z-index:10;">
            <div class="pixel-box" id="mission-tracker" style="font-size:11px; padding:6px;">Mission: ---</div>
            <button class="pixel-btn" style="width:auto; padding:4px 8px; font-size:10px;" onclick="openMenu()">MENU</button>
        </div>
        
        <canvas id="game-canvas" width="480" height="720"></canvas>

        <!-- ドット風下部メッセージ枠 -->
        <div id="dialogue-overlay">
            <div id="speaker-name" style="color:#ffcc00; font-weight:bold; font-size:13px; margin-bottom:4px;"></div>
            <div id="dialogue-text" style="font-size:12px; line-height:1.4;"></div>
            <div id="choices-container" style="margin-top:8px;"></div>
        </div>
    </div>

    <!-- 5. ステージ評価画面 -->
    <div id="eval-screen" class="screen pixel-box" style="overflow-y:auto;">
        <h3>STAGE CLEAR!</h3>
        <canvas id="radarChart" width="300" height="200"></canvas>
        <p style="margin-top:10px;"><b>診断タイプ:</b> <span id="eval-type" style="color:#ffcc00;">--</span></p>
        <p><b>アドバイス:</b></p>
        <p id="eval-advice" style="font-size:12px; color:#ccc; line-height:1.4;"></p>
        <button class="pixel-btn" onclick="goToMap()">マップに戻る</button>
    </div>

    <!-- 6. 設定・セーブ消去メニュー -->
    <div id="menu-screen" class="screen pixel-box">
        <h3>メニュー / 設定</h3>
        <label>BGM 音量調整:</label><br>
        <input type="range" id="bgm-volume" min="0" max="100" value="50" style="width:100%; margin:10px 0;"><br><br>
        <button class="pixel-btn" style="background:#600;" onclick="resetData()">セーブデータを削除して最初から</button><br><br>
        <button class="pixel-btn" onclick="closeMenu()">閉じる</button>
    </div>
</div>

<script>
    let gameState = {
        name: "",
        skin: "学ラン",
        points: 0,
        unlockedStages: 1,
        currentStage: 1,
        talkedNpcList: [] // 話しかけ済みのIDを記録
    };

    let selectedSkinTemp = "学ラン";

    const stages = [
        { id: 1, name: "Lv.1 教室 - 散らかった環境", mission: "教室を整頓して集中できる環境を作ろう" },
        { id: 2, name: "Lv.2 廊下 - 落とし物", mission: "持ち主を探して手伝おう" },
        { id: 3, name: "Lv.3 体育館 - 用具準備", mission: "みんなと協力して準備を終えよう" },
        { id: 4, name: "Lv.4 校門 - 朝の挨拶", mission: "気持ちよく挨拶を交わそう" },
        { id: 5, name: "Lv.5 運動場 - チーム分け", mission: "全員が納得する分け方を決めよう" }
    ];

    function init() {
        let saved = localStorage.getItem('7habits_save');
        if(saved) {
            gameState = JSON.parse(saved);
        }
    }

    function saveGame() {
        localStorage.setItem('7habits_save', JSON.stringify(gameState));
    }

    function goToSetup() {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('setup-screen').classList.add('active');
    }

    function selectSkin(skinName, el) {
        selectedSkinTemp = skinName;
        document.querySelectorAll('.skin-card').forEach(c => c.classList.remove('selected'));
        el.classList.add('selected');
    }

    function startGame() {
        let inputName = document.getElementById('player-name-input').value.trim();
        gameState.name = inputName; // 空欄の場合はそのまま空欄（または名無し）に
        gameState.skin = selectedSkinTemp;
        saveGame();
        goToMap();
    }

    function goToMap() {
        saveGame();
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('map-screen').classList.add('active');
        document.getElementById('user-points').innerText = gameState.points;

        let container = document.getElementById('stage-buttons');
        container.innerHTML = "";
        stages.forEach(st => {
            let btn = document.createElement('button');
            btn.className = "pixel-btn";
            if(st.id <= gameState.unlockedStages) {
                btn.innerText = st.name;
                btn.onclick = () => launchStage(st.id);
            } else {
                btn.innerText = st.name + " 🔒";
                btn.disabled = true;
                btn.style.opacity = "0.4";
            }
            container.appendChild(btn);
        });
    }

    function launchStage(stageId) {
        gameState.currentStage = stageId;
        gameState.talkedNpcList = []; // ステージ開始時に会話履歴リセット
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('game-screen').classList.add('active');
        
        let st = stages.find(s => s.id === stageId);
        document.getElementById('mission-tracker').innerText = "Mission: " + st.mission;

        initCanvasStage(st);
    }

    function initCanvasStage(st) {
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        
        ctx.fillStyle = "#1e1e24";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#fff";
        ctx.font = "14px Courier New";
        ctx.fillText("【" + st.name + "】", 20, 60);
        ctx.fillText("画面をタップして調べる・話しかける", 20, 90);

        canvas.onclick = () => {
            triggerInteraction('npc_1');
        };
    }

    // 会話・調べ判定（1度話しかけた人は話しかけられない仕組み）
    function triggerInteraction(targetId) {
        let dialogue = document.getElementById('dialogue-overlay');
        let choices = document.getElementById('choices-container');
        choices.innerHTML = "";

        // すでに話しかけたか判定
        if(gameState.talkedNpcList.includes(targetId)) {
            document.getElementById('speaker-name').innerText = "【お知らせ】";
            document.getElementById('dialogue-text').innerText = "（もうこの人・場所からは新しい話は聞けないようだ。）";
            dialogue.style.display = "block";

            let closeBtn = document.createElement('button');
            closeBtn.className = "choice-btn";
            closeBtn.innerText = "閉じる";
            closeBtn.onclick = () => { dialogue.style.display = "none"; };
            choices.appendChild(closeBtn);
            return;
        }

        // 初回会話
        dialogue.style.display = "block";
        document.getElementById('speaker-name').innerText = "クラスメイト";
        document.getElementById('dialogue-text').innerText = "本棚が倒れそうで散らかってるんだ...どうしたらいいと思う？";
        
        let options = [
            { text: "1. 一緒に一番上の重い本から片付けよう", pts: 20 },
            { text: "2. 先生を呼びに行って任せよう", pts: 10 },
            { text: "3. あとでみんなでやることにして放置する", pts: 0 }
        ];

        options.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = "choice-btn";
            btn.innerText = opt.text;
            btn.onclick = () => {
                gameState.points += opt.pts;
                gameState.talkedNpcList.push(targetId); // 会話済みIDを記録！
                dialogue.style.display = "none";
                finishStage();
            };
            choices.appendChild(btn);
        });
    }

    function finishStage() {
        if(gameState.currentStage === gameState.unlockedStages) {
            gameState.unlockedStages++;
        }
        saveGame();
        
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('eval-screen').classList.add('active');

        renderChart();
    }

    function renderChart() {
        let ctx = document.getElementById('radarChart').getContext('2d');
        if(window.myChart) window.myChart.destroy();

        window.myChart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['主体性', '目的設定', '優先順位', 'Win-Win', '理解と尊重', 'シナジー'],
                datasets: [{
                    label: '能力値',
                    data: [85, 70, 75, 90, 65, 80],
                    backgroundColor: 'rgba(255, 204, 0, 0.2)',
                    borderColor: '#ffcc00',
                    pointBackgroundColor: '#fff'
                }]
            },
            options: {
                scales: {
                    r: {
                        angleLines: { color: '#555' },
                        grid: { color: '#444' },
                        pointLabels: { color: '#fff', font: { size: 10 } },
                        ticks: { display: false, backdropColor: 'transparent' }
                    }
                },
                plugins: { legend: { display: false } }
            }
        });

        document.getElementById('eval-type').innerText = "主体的な解決者タイプ";
        document.getElementById('eval-advice').innerText = "周りを巻き込みながら素早く行動できました！次は優先順位をさらに意識してみましょう。";
    }

    function openMenu() {
        document.getElementById('menu-screen').classList.add('active');
    }

    function closeMenu() {
        document.getElementById('menu-screen').classList.remove('active');
    }

    function resetData() {
        if(confirm("本当にセーブデータを全削除して最初からにしますか？")) {
            localStorage.removeItem('7habits_save');
            location.reload();
        }
    }

    init();
</script>
</body>
</html>
